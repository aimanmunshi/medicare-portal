apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-${COLOR}
spec:
  replicas: 1
  selector:
    matchLabels: { app: medicare, version: "${COLOR}" }
  template:
    metadata:
      labels: { app: medicare, version: "${COLOR}" }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: web
        image: ${IMAGE}:${TAG}
        ports: [{ containerPort: 5000 }]
        env:
        - { name: APP_COLOR, value: "${COLOR}" }
        - { name: APP_VERSION, value: "${TAG}" }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 192Mi }
        readinessProbe:
          httpGet: { path: /health, port: 5000 }
          initialDelaySeconds: 3
      volumes:
      - { name: tmp, emptyDir: {} }
